name: Configure Microsoft Store CLI
description: Installs msstore-cli and authenticates it against Partner Center
inputs:
  tenant-id:
    required: true
  seller-id:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
runs:
  using: composite
  steps:
    - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

    - shell: pwsh
      env:
        AZURE_AD_TENANT_ID: ${{ inputs.tenant-id }}
        SELLER_ID: ${{ inputs.seller-id }}
        AZURE_AD_APPLICATION_CLIENT_ID: ${{ inputs.client-id }}
        AZURE_AD_APPLICATION_SECRET: ${{ inputs.client-secret }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $false

        msstore reconfigure `
          --tenantId $env:AZURE_AD_TENANT_ID `
          --sellerId $env:SELLER_ID `
          --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
          --clientSecret $env:AZURE_AD_APPLICATION_SECRET `
          -vvv 2>&1 | ForEach-Object { Write-Host $_ }
        if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with exit code $LASTEXITCODE" }
