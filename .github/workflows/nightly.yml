name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Compare against last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered; building regardless of new commits."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha="$(git rev-parse --short HEAD)"
          last_sha="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null | grep -oE '\([0-9a-f]+\)' | tr -d '()' || true)"

          if [ "$last_sha" = "$current_sha" ]; then
            echo "No new commits since last nightly ($current_sha); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since last nightly (was ${last_sha:-none}, now $current_sha)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Publish nightly build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - uses: ./.github/actions/package-msix

      - uses: ./.github/actions/sign-test-msix
        with:
          pfx-base64: ${{ secrets.TEST_SIGNING_CERT_PFX }}
          pfx-password: ${{ secrets.TEST_SIGNING_CERT_PASSWORD }}

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          foreach ($file in "winsp.exe", "winsp.msix") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii -NoNewline "$file.sha256"
          }

      - name: Publish nightly release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          gh release delete nightly \
            --repo "$GITHUB_REPOSITORY" \
            --yes --cleanup-tag || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "winsp nightly ($sha)" \
            --notes "Automated build from commit $sha. Not a stable release." \
            --prerelease \
            winsp.exe winsp.exe.sha256 winsp.msix winsp.msix.sha256
