name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  nightly:
    name: Publish nightly build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - name: Package MSIX
        shell: pwsh
        run: |
          $stagingDir = "packaging-stage"
          New-Item -ItemType Directory -Path "$stagingDir\Assets" -Force | Out-Null

          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "could not find [workspace.package] version in Cargo.toml"
          }
          $msixVersion = "$($Matches[1]).0"

          $manifest = Get-Content packaging\AppxManifest.xml -Raw
          $manifest = $manifest -replace '(<Identity[^>]*\bVersion=")[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(")', "`${1}$msixVersion`${2}"
          Set-Content -Path "$stagingDir\AppxManifest.xml" -Value $manifest -NoNewline

          Copy-Item packaging\Assets\* "$stagingDir\Assets\"
          Copy-Item target\release\winsp.exe "$stagingDir\winsp.exe"

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe not found on runner" }

          & $makeappx pack /d $stagingDir /p target\release\winsp.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          foreach ($file in "winsp.exe", "winsp.msix") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii -NoNewline "$file.sha256"
          }

      - name: Publish nightly release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          gh release delete nightly \
            --repo "$GITHUB_REPOSITORY" \
            --yes --cleanup-tag || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "winsp nightly ($sha)" \
            --notes "Automated build from commit $sha. Not a stable release." \
            --prerelease \
            winsp.exe winsp.exe.sha256 winsp.msix winsp.msix.sha256
