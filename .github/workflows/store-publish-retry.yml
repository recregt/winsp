name: Store publish retry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose MSIX asset should be (re-)published (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Retry Microsoft Store publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p target/release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "winsp.msix" \
            --dir target/release \
            --clobber

      - uses: ./.github/actions/msstore-configure # zizmor: ignore[self-repository]
        with:
          tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
          seller-id: ${{ secrets.SELLER_ID }}
          client-id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - uses: ./.github/actions/msstore-publish # zizmor: ignore[self-repository]
        with:
          msix-path: target\release\winsp.msix
