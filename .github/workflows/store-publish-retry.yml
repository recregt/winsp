name: Store publish retry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose MSIX asset should be (re-)published (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Retry Microsoft Store publish
    runs-on: windows-latest
    steps:
      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "winsp.msix" \
            --dir target/release \
            --clobber

      - uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Publish to Microsoft Store
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET `
            -vvv 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with exit code $LASTEXITCODE" }

          msstore publish target\release\winsp.msix -id 9N22CB01DDDJ -vvv 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with exit code $LASTEXITCODE" }
