name: Lint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**", "scripts/**", "cliff.toml"]
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**", "scripts/**", "cliff.toml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: python3 scripts/install/actionlint.py

      - name: Check workflow files
        run: '"$HOME/.cargo/bin/actionlint" -color'

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: scripts/

  changelog-config:
    name: changelog config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: git-cliff

      - run: python3 scripts/verify/cliff-config.py
