name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw "could not find [workspace.package] version in Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$cargoVersion'"
          }

      - name: Verify CHANGELOG.md was updated
        run: python scripts/verify/changelog-version.py

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install frontend dependencies
        working-directory: crates/app-tauri
        run: npm ci

      - name: Build release binary
        working-directory: crates/app-tauri
        run: npx tauri build --no-bundle -- --locked

      - uses: ./.github/actions/package-msix

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          $hash = (Get-FileHash winsp.msix -Algorithm SHA256).Hash.ToLower()
          "$hash  winsp.msix" | Out-File -Encoding ascii -NoNewline winsp.msix.sha256

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: git-cliff --config cliff.toml --latest --strip header -o target/release/release-notes.md

      - name: Create GitHub release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets only."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              winsp.msix winsp.msix.sha256
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "winsp $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              winsp.msix winsp.msix.sha256
          fi

      - name: Check for Store credentials
        id: store_creds
        shell: bash
        env:
          TENANT_ID_SET: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: |
          if [ -n "$TENANT_ID_SET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/msstore-configure
        if: steps.store_creds.outputs.configured == 'true'
        with:
          tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
          seller-id: ${{ secrets.SELLER_ID }}
          client-id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - uses: ./.github/actions/msstore-publish
        if: steps.store_creds.outputs.configured == 'true'
        with:
          msix-path: target\release\winsp.msix
