name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          $hash = (Get-FileHash winsp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  winsp.exe" | Out-File -Encoding ascii -NoNewline winsp.exe.sha256

      - name: Create GitHub release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "winsp $GITHUB_REF_NAME" \
            --generate-notes \
            winsp.exe winsp.exe.sha256
