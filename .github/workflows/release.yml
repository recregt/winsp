name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw "could not find [workspace.package] version in Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$cargoVersion'"
          }

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - uses: ./.github/actions/package-msix

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          $hash = (Get-FileHash winsp.msix -Algorithm SHA256).Hash.ToLower()
          "$hash  winsp.msix" | Out-File -Encoding ascii -NoNewline winsp.msix.sha256

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --config cliff.toml --latest --strip header -o target/release/release-notes.md

      - name: Create GitHub release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "winsp $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            winsp.msix winsp.msix.sha256

      - name: Check for Store credentials
        id: store_creds
        shell: bash
        env:
          TENANT_ID_SET: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: |
          if [ -n "$TENANT_ID_SET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Microsoft Store CLI
        if: steps.store_creds.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Publish to Microsoft Store
        if: steps.store_creds.outputs.configured == 'true'
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

          msstore publish target\release\winsp.msix -id 9N22CB01DDDJ
