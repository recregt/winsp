name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw "could not find [workspace.package] version in Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$cargoVersion'"
          }

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - uses: ./.github/actions/package-msix

      - name: Checksum
        working-directory: target/release
        shell: pwsh
        run: |
          foreach ($file in "winsp.exe", "winsp.msix") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii -NoNewline "$file.sha256"
          }

      - name: Create GitHub release
        working-directory: target/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "winsp $GITHUB_REF_NAME" \
            --generate-notes \
            winsp.exe winsp.exe.sha256 winsp.msix winsp.msix.sha256
