name: Store auth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify Store credentials
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/msstore-configure
        with:
          tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
          seller-id: ${{ secrets.SELLER_ID }}
          client-id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Read submission (no changes made)
        shell: pwsh
        run: |
          msstore submission get 9N22CB01DDDJ -vvv 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed with exit code $LASTEXITCODE" }

          Write-Host "Credentials are valid and can see the WinSP submission."
