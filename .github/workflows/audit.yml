name: Audit

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "**/Cargo.lock", "deny.toml", ".github/workflows/**", ".github/actions/**"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock", "deny.toml", ".github/workflows/**", ".github/actions/**"]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit

      - name: Audit
        run: |
          ignored_advisories=(
            # Linux-only GTK/GLib bindings pulled in transitively by
            # tray-icon's Linux tray backend (via tauri). winsp only ships
            # for Windows, so this code path never compiles into the real
            # binary.
            RUSTSEC-2024-0411 RUSTSEC-2024-0412 RUSTSEC-2024-0413
            RUSTSEC-2024-0414 RUSTSEC-2024-0415 RUSTSEC-2024-0416
            RUSTSEC-2024-0417 RUSTSEC-2024-0418 RUSTSEC-2024-0419
            RUSTSEC-2024-0420 RUSTSEC-2024-0429 RUSTSEC-2024-0370
            RUSTSEC-2025-0075 RUSTSEC-2025-0080 RUSTSEC-2025-0081
            RUSTSEC-2025-0098 RUSTSEC-2025-0100
            # quick-xml DoS advisories, reachable only through tauri-build's
            # plist/compression tooling, which runs at our own build time
            # against our own trusted config/assets, not at runtime against
            # untrusted input.
            RUSTSEC-2026-0194 RUSTSEC-2026-0195
            # time DoS advisory, reachable through tauri's cookie handling.
            # winsp is a local desktop app with no attacker-controlled
            # network input, so this has no real exploit path here.
            RUSTSEC-2026-0009
          )
          ignore_flags=()
          for id in "${ignored_advisories[@]}"; do
            ignore_flags+=(--ignore "$id")
          done

          cargo audit "${ignore_flags[@]}" --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-deny

      - run: cargo deny check bans licenses sources

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: zizmor

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .
