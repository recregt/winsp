name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Lint and test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-tarpaulin

      - run: cargo tarpaulin --workspace --locked --timeout 120

  windows:
    name: Build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p winsp-app --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: winsp-${{ github.sha }}
          path: target/release/winsp.exe
          retention-days: 7
          if-no-files-found: error

      - name: Package MSIX
        shell: pwsh
        run: |
          $stagingDir = "packaging-stage"
          New-Item -ItemType Directory -Path "$stagingDir\Assets" -Force | Out-Null
          Copy-Item packaging\AppxManifest.xml "$stagingDir\AppxManifest.xml"
          Copy-Item packaging\Assets\* "$stagingDir\Assets\"
          Copy-Item target\release\winsp.exe "$stagingDir\winsp.exe"

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe not found on runner" }

          & $makeappx pack /d $stagingDir /p winsp.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: winsp-msix-${{ github.sha }}
          path: winsp.msix
          retention-days: 7
          if-no-files-found: error
