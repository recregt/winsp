[changelog]
header = """
# Changelog

All notable changes to WinSP are documented here. Format follows
[Keep a Changelog](https://keepachangelog.com/en/1.0.0/).
"""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} by {% if commit.remote.username is ending_with("[bot]") %}[@{{ commit.remote.username }}](https://github.com/apps/{{ commit.remote.username | replace(from="[bot]", to="") }}){% else %}@{{ commit.remote.username }}{% endif %} in #{{ commit.remote.pr_number }}{% endif %}
{% endfor %}
{%- endfor %}
{% if previous and previous.version and version %}
**Full Changelog**: https://github.com/recregt/winsp/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = ""

[git]
ignore_tags = "^nightly$"
conventional_commits = true
filter_unconventional = true
require_conventional = false
protect_breaking_commits = true
filter_commits = true
sort_commits = "oldest"
split_commits = false
processing_order = ["commit_preprocessors", "conventional_commits", "commit_parsers", "link_parsers"]
commit_preprocessors = [
  { pattern = '(?s)^([^\n]*).*$', replace = "${1}" },
  { pattern = '(?m) \(#\d+\)$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 2 -->Changed" },
  { message = "^(ci|docs|test|chore)", skip = true },
]
