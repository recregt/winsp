[workspace]
members = [
    "crates/core",
    "crates/windows",
    "crates/app",
    "crates/app-tauri/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
authors = ["WinSP Contributors"]
license = "MIT"
repository = "https://github.com/recregt/winsp"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
