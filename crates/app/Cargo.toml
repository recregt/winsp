[package]
name = "winsp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "winsp"
path = "src/main.rs"

[dependencies]
winsp-core = { path = "../core" }
winsp-indexer = { path = "../indexer" }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.52"
windows = { version = "0.62", features = ["ApplicationModel", "Foundation"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }

